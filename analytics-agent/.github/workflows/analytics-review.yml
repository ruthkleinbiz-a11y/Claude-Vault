name: Biweekly Analytics Report

on:
  schedule:
    # Runs every other Monday at 7:00 AM UTC (Monday morning delivery)
    - cron: "0 7 1,15 * *"
  workflow_dispatch:  # allows manual trigger from GitHub UI anytime

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-agent

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        run: |
          mkdir -p secrets
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > secrets/google-service-account.json

      - name: Run analytics agent
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          WINDSOR_ACCOUNT_ID: ${{ secrets.WINDSOR_ACCOUNT_ID }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: secrets/google-service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          HOTJAR_API_KEY: ${{ secrets.HOTJAR_API_KEY }}
          HOTJAR_SITE_ID: ${{ secrets.HOTJAR_SITE_ID }}
          SEARCH_ATLAS_API_KEY: ${{ secrets.SEARCH_ATLAS_API_KEY }}
        run: python agent.py

      - name: Upload PDF report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytics-report
          path: analytics-agent/reports/analytics-report-*.pdf
          retention-days: 90

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Update Weekly Signal dashboard artifact
        working-directory: ${{ github.workspace }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash analytics-agent/dashboard/publish_artifact.sh
